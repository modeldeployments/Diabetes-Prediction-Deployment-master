<!DOCTYPE html>

<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">

    <title>Diabetes Predictor</title>

    <link rel="shortcut icon"
          href="{{ url_for('static', filename='diabetes-favicon.ico') }}">

    <link rel="stylesheet"
          type="text/css"
          href="{{ url_for('static', filename='styles.css') }}">

    <script src="https://kit.fontawesome.com/5f3f547070.js"
            crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
          rel="stylesheet">

    <style>

        /* Try Another Button */

        .try-again {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;

            background-color: white;
            color: #8e278f;

            border: 3px solid #8e278f;
            border-radius: 25px;

            font-size: 18px;
            font-weight: bold;

            text-decoration: none;
            cursor: pointer;
        }

        .try-again:hover {
            background-color: #8e278f;
            color: white;
        }

    </style>

</head>


<body>

    <!-- Website Title -->

    <div class="container">

        <h2 class='container-heading'>
            <span class="heading_font">
                Diabetes Predictor
            </span>
        </h2>

        <div class='description'>

            <p>
                A Machine Learning Web App, Built with Flask,
                Deployed using Render.
            </p>

        </div>

    </div>


    <!-- Result -->

    <div class="results">

        {% if prediction==1 %}

            <h1>
                Prediction:
                <span class='danger'>
                    Oops! You have DIABETES.
                </span>
            </h1>

            <img
                class="gif"
                src="{{ url_for('static', filename='diabetes.webp') }}"
                alt="Diabetes Image"
            >

        {% elif prediction==0 %}

            <h1>
                Prediction:
                <span class='safe'>
                    Great! You DON'T have diabetes.
                </span>
            </h1>

            <img
                class="gif1"
                src="{{ url_for('static', filename='no-diabetes.webp') }}"
                alt="Not Diabetes Image"
            >

        {% endif %}


        <!-- Try Another Button -->

        <br>

        <a href="/" class="try-again">
            🔄 Try Another
        </a>

    </div>


    <!-- Footer -->

    <div class='footer'>

        <div class="contact">

            <a
                target="_blank"
                href="https://github.com/anu/Diabetes-Prediction-Deployment"
            >
                <i class="fab fa-github fa-lg contact-icon"></i>
            </a>

            <a
                target="_blank"
                href="https://www.linkedin.com/in/anu"
            >
                <i class="fab fa-linkedin fa-lg contact-icon"></i>
            </a>

        </div>

        <p class='footer-description'>
            Made with ❤️ by Anu
        </p>

    </div>


</body>

</html>
